<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Tarik Ermis</title>
  <desc id="desc">Software architect, AI engineer, and founder of n3tz. I build what others plan.</desc>
  <defs>
    <linearGradient id="accent" x1="70" y1="70" x2="1080" y2="325" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FA5617"/>
      <stop offset="0.58" stop-color="#F43653"/>
      <stop offset="1" stop-color="#EE0B74"/>
    </linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(910 194) rotate(180) scale(420 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FA5617" stop-opacity=".16"/>
      <stop offset=".62" stop-color="#EE0B74" stop-opacity=".055"/>
      <stop offset="1" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27272A" stroke-width="1" opacity=".34"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="390" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="390" fill="#09090B"/>
    <rect width="1200" height="390" fill="url(#grid)" opacity=".44"/>
    <rect width="1200" height="390" fill="url(#wash)"/>

    <path d="M760 79C838 24 902 67 950 127C1007 198 1060 112 1149 63" fill="none" stroke="url(#accent)" stroke-width="1.6" opacity=".72"/>
    <path d="M738 303C823 251 864 297 930 239C997 180 1070 242 1161 312" fill="none" stroke="url(#accent)" stroke-width="1.6" opacity=".72"/>
    <path d="M832 37C872 115 861 181 944 195C1034 211 1069 282 1060 355" fill="none" stroke="url(#accent)" stroke-width="1.6" opacity=".72"/>
    <path d="M703 196C795 172 858 199 944 195C1029 191 1096 188 1180 166" fill="none" stroke="url(#accent)" stroke-width="1.6" opacity=".72"/>

    <g fill="url(#accent)">
      <circle cx="760" cy="79" r="7"/>
      <circle cx="832" cy="37" r="5"/>
      <circle cx="1149" cy="63" r="6"/>
      <circle cx="1180" cy="166" r="4"/>
      <circle cx="1161" cy="312" r="8"/>
      <circle cx="1060" cy="355" r="5"/>
      <circle cx="738" cy="303" r="6"/>
      <circle cx="703" cy="196" r="4"/>
    </g>
    <circle cx="944" cy="195" r="32" fill="#FA5617" opacity=".22" filter="url(#glow)"/>
    <circle cx="944" cy="195" r="12" fill="#18181B" stroke="url(#accent)" stroke-width="4"/>

    <rect x="66" y="62" width="9" height="9" rx="4.5" fill="#FA5617"/>
    <text x="91" y="72" fill="#A1A1AA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">TARIK ERMIS / BUILDING IN PUBLIC</text>

    <text x="64" y="150" fill="#FAFAFA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.4">I build what</text>
    <text x="64" y="211" fill="url(#accent)" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.7">others plan.</text>
    <text x="68" y="255" fill="#D4D4D8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Software architect · AI engineer · founder of n3tz</text>

    <line x1="68" y1="299" x2="650" y2="299" stroke="#3F3F46"/>
    <text x="68" y="331" fill="#FAFAFA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">10+</text>
    <text x="108" y="331" fill="#71717A" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">YEARS SOFTWARE</text>
    <text x="275" y="331" fill="#FAFAFA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">5+</text>
    <text x="307" y="331" fill="#71717A" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">YEARS AI</text>
    <text x="421" y="331" fill="#FAFAFA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">0→1</text>
    <text x="465" y="331" fill="#71717A" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">PRODUCTS</text>

    <text x="944" y="244" fill="#A1A1AA" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">PIXELS → PACKETS</text>
  </g>
