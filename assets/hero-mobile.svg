    <circle cx="490" cy="444" r="12" fill="#18181B" stroke="url(#accent)" stroke-width="4"/>

    <rect x="51" y="51" width="10" height="10" rx="5" fill="#FA5617"/>
    <text x="78" y="62" fill="#A1A1AA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3">TARIK ERMIS</text>

    <text x="49" y="154" fill="#FAFAFA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.2">I build what</text>
    <text x="49" y="218" fill="url(#accent)" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-1.5">others plan.</text>
    <text x="52" y="268" fill="#D4D4D8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20">Software architect · AI engineer</text>
    <text x="52" y="299" fill="#D4D4D8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20">Founder of n3tz</text>

    <line x1="52" y1="358" x2="289" y2="358" stroke="#3F3F46"/>
    <text x="52" y="394" fill="#FAFAFA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">10+</text>
    <text x="52" y="419" fill="#71717A" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">YEARS SOFTWARE</text>
    <text x="177" y="394" fill="#FAFAFA" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">5+</text>
    <text x="177" y="419" fill="#71717A" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">YEARS AI</text>
    <text x="52" y="552" fill="#71717A" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.4">PIXELS → PACKETS</text>
